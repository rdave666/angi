name: Build Android APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Prepare build environment
        run: |
          # Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Stable development signing identity.
          #
          # Never generate a random debug key on an ephemeral CI runner: that
          # changes the APK signature and forces Android to uninstall the old app.
          #
          # Development builds intentionally use the fixed AOSP test signing key
          # from the pinned Android 14 source tag. This public key is DEVELOPMENT
          # ONLY and must never be used for a production/Play release.
          AOSP_BUILD_REF="android-14.0.0_r1"
          AOSP_KEY_BASE="https://raw.githubusercontent.com/aosp-mirror/platform_build/${AOSP_BUILD_REF}/target/product/security"

          curl --fail --silent --show-error --location \
            "${AOSP_KEY_BASE}/testkey.pk8" \
            --output aosp-testkey.pk8
          curl --fail --silent --show-error --location \
            "${AOSP_KEY_BASE}/testkey.x509.pem" \
            --output aosp-testkey.x509.pem

          echo "495675d32e89a149d5abe191f4e9c0e218b9068714e9b53a7c91e164a0741a23  aosp-testkey.pk8" | sha256sum --check --strict
          echo "a4384ba815b9499a5ce349b4e33c1755278873fe2eac150a068823f526e6dbde  aosp-testkey.x509.pem" | sha256sum --check --strict

          openssl pkcs8 -inform DER -nocrypt \
            -in aosp-testkey.pk8 \
            -out aosp-testkey.pem
          openssl pkcs12 -export \
            -inkey aosp-testkey.pem \
            -in aosp-testkey.x509.pem \
            -name androiddebugkey \
            -out debug.keystore \
            -passout pass:android

          SIGNING_SHA256=$(keytool -list -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')

          EXPECTED_SIGNING_SHA256="a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc"
          if [ "$SIGNING_SHA256" != "$EXPECTED_SIGNING_SHA256" ]; then
            echo "::error::Unexpected development signing certificate: $SIGNING_SHA256"
            exit 1
          fi
          echo "Stable development signing certificate verified: $SIGNING_SHA256"

          rm -f aosp-testkey.pk8 aosp-testkey.x509.pem aosp-testkey.pem

          # Ensure gradlew has execute permissions
          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Test Outbound Phone Bridge
        run: python3 -m unittest discover -s connectors/phone_bridge -v

      - name: Run Unit and Robolectric Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK and Verify Native Library Packaging
        id: find_apk
        run: |
          RAW_APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK_PATH" ]; then
            RAW_APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Found raw APK: $RAW_APK_PATH"

          # Extract versionName and versionCode from Gradle
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep 'versionCode =' app/build.gradle.kts | head -n 1 | sed -E 's/.*= *([0-9]+).*/\1/')

          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            METADATA_FILE=$(find app/build/outputs/apk/debug -name "output-metadata.json" | head -n 1)
            if [ -f "$METADATA_FILE" ]; then
              VERSION_NAME=$(jq -r '.elements[0].versionName // empty' "$METADATA_FILE")
              VERSION_CODE=$(jq -r '.elements[0].versionCode // empty' "$METADATA_FILE")
            fi
          fi

          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Failed to extract versionName or versionCode from Gradle build files."
            exit 1
          fi

          VERSIONED_APK_NAME="angi-v${VERSION_NAME}-build${VERSION_CODE}-debug.apk"
          VERSIONED_APK_DIR=$(dirname "$RAW_APK_PATH")
          VERSIONED_APK_PATH="${VERSIONED_APK_DIR}/${VERSIONED_APK_NAME}"
          cp "$RAW_APK_PATH" "$VERSIONED_APK_PATH"
          BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "versioned_apk_name=$VERSIONED_APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=$VERSIONED_APK_PATH" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

          echo "=== Versioned APK details ==="
          echo "Version: $VERSION_NAME"
          echo "Build: $VERSION_CODE"
          echo "APK Name: $VERSIONED_APK_NAME"
          echo "APK Path: $VERSIONED_APK_PATH"

          echo "=== Inspecting APK native libraries and ABI packaging ==="
          unzip -l "$VERSIONED_APK_PATH" | grep -E "lib/|assets/" || true

          echo "=== Verifying APK signing identity ==="
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found"
            exit 1
          fi
          APK_SIGNER_OUTPUT=$("$APKSIGNER" verify --print-certs "$VERSIONED_APK_PATH" 2>&1)
          echo "$APK_SIGNER_OUTPUT"
          APK_SIGNING_SHA256=$(printf '%s\n' "$APK_SIGNER_OUTPUT" \
            | grep -i -m1 'certificate.*sha-256.*digest' \
            | sed -E 's/.*:[[:space:]]*([0-9A-Fa-f]+).*/\1/' \
            | tr '[:upper:]' '[:lower:]')
          EXPECTED_SIGNING_SHA256="a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc"
          if [ "$APK_SIGNING_SHA256" != "$EXPECTED_SIGNING_SHA256" ]; then
            echo "::error::APK was signed by unexpected certificate: $APK_SIGNING_SHA256"
            exit 1
          fi
          echo "APK signing identity verified: $APK_SIGNING_SHA256"

          echo "=== CI Verification Note ==="
          echo "CI verified code compilation, unit/Robolectric tests, Android lint, and APK packaging."

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find_apk.outputs.versioned_apk_name }}
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME="${{ steps.find_apk.outputs.version_name }}"
          VERSION_CODE="${{ steps.find_apk.outputs.version_code }}"
          APK_FILE="${{ steps.find_apk.outputs.apk_path }}"
          BUILD_DATE="${{ steps.find_apk.outputs.build_date }}"
          COMMIT_SHA="${{ github.sha }}"

          RELEASE_NOTES=$(cat <<EOF
          ## ANGI Development Build

          - **Version**: ${VERSION_NAME}
          - **Build**: ${VERSION_CODE}
          - **Commit**: ${COMMIT_SHA}
          - **Build Date**: ${BUILD_DATE}

          *Debug / development build*
          EOF
          )

          # Configure git identity and force-update dev-latest tag to point to current commit SHA
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f dev-latest "${COMMIT_SHA}"
          git push -f origin dev-latest || true

          # If the rolling release tag exists, replace previous assets before uploading new APK
          if gh release view dev-latest >/dev/null 2>&1; then
            echo "dev-latest release exists. Replacing previous APK assets..."
            for asset in $(gh release view dev-latest --json assets --jq '.assets[].name'); do
              echo "Deleting old asset: $asset"
              gh release delete-asset dev-latest "$asset" --yes || true
            done

            echo "Updating rolling release notes..."
            gh release edit dev-latest \
              --title "ANGI Development Build" \
              --notes "$RELEASE_NOTES" \
              --target "${COMMIT_SHA}" \
              --prerelease

            echo "Attaching new versioned APK asset..."
            gh release upload dev-latest "$APK_FILE" --clobber
          else
            echo "Creating dev-latest rolling release..."
            gh release create dev-latest "$APK_FILE" \
              --title "ANGI Development Build" \
              --notes "$RELEASE_NOTES" \
              --target "${COMMIT_SHA}" \
              --prerelease
          fi
